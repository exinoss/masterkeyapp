# docker-compose.yml — MasterKey Backend

services:
  masterkey_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: masterkey-backend:local
    container_name: masterkey_backend
    restart: unless-stopped

    # ── Variables de entorno ─────────────────────────────────
    # .env real vive fuera de git, ver .env.example
    env_file:
      - .env

    # ── Healthcheck ──────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # ── Límites de recursos ──────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # ── Red aislada ──────────────────────────────────────────
    networks:
      - masterkey_net

    # ── Logging ──────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx_ssl:
    container_name: nginx_ssl_masterkey
    image: masterkey-nginx:local
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx_conf
    tty: true
    # El seccomp por defecto del Docker viejo de este servidor le devuelve
    # EPERM al pwrite() de /run/nginx.pid y nginx no arranca. Si con la
    # versión pineada del Dockerfile alcanza, esta línea se puede sacar.
    security_opt:
      - seccomp:unconfined
    ports:
      # TODO: confirmar con el servidor que este puerto host esté libre
      - "9616:443"
    volumes:
      - nginxfiles:/home/app/nginx
    command: >
      bash -c "
        mkdir -p /var/www/html /etc/nginx/logs /ssl &&
        cp -r /home/app/nginx/html/. /var/www/html/ 2>/dev/null || true &&
        cp -r /home/app/nginx/logs/. /etc/nginx/logs/ 2>/dev/null || true &&
        cp -r /home/app/nginx/ssl/. /ssl/ &&
        nginx -g 'daemon off;'
      "
    restart: always
    depends_on:
      - masterkey_backend
    networks:
      - masterkey_net

volumes:
  # OJO: este es el MISMO volumen "nginxfiles" que ya usan RememberGo,
  # webtestmathuteq y apiescuela en este servidor — no es uno propio de
  # MasterKey. Ya existe y ya trae el cert institucional (ssl/), por eso
  # no lleva "name:" propio: apunta directo al que ya está ahí.
  nginxfiles:
    external: true

networks:
  masterkey_net:
    driver: bridge
