# docker-compose.yml — MasterKey Backend

services:
  masterkey_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: masterkey-backend:local
    container_name: masterkey_backend
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - masterkey_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx_ssl:
    container_name: nginx_ssl_masterkey
    image: masterkey-nginx:local
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx_conf
    tty: true
    security_opt:
      - seccomp:unconfined
    ports:
      - "9616:443"
    volumes:
      - nginxfiles:/home/app/nginx
    command: >
      bash -c "
        mkdir -p /var/www/html /etc/nginx/logs /ssl &&
        cp -r /home/app/nginx/html/. /var/www/html/ 2>/dev/null || true &&
        cp -r /home/app/nginx/logs/. /etc/nginx/logs/ 2>/dev/null || true &&
        cp -r /home/app/nginx/ssl/. /ssl/ &&
        nginx -g 'daemon off;'
      "
    restart: always
    depends_on:
      - masterkey_backend
    networks:
      - masterkey_net

volumes:
  # Volumen compartido con RememberGo/webtestmathuteq/apiescuela, ya trae el cert institucional
  nginxfiles:
    external: true

networks:
  masterkey_net:
    driver: bridge
